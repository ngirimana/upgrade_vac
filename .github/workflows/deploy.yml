name: CI & Deploy (vac.rw)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-vacrw
  cancel-in-progress: true

jobs:
  ci:
    name: Build (CI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22.14.0
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"

      - name: Enable Corepack + use Yarn Classic (from packageManager)
        run: |
          corepack enable
          node -v
          yarn -v
          which yarn

      - name: Install dependencies (Yarn Classic)
        run: yarn install --frozen-lockfile

      - name: Build Next.js
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: yarn build

  deploy:
    name: Deploy to Contabo
    needs: ci
    if: ${{ needs.ci.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.SERVER_IP }}" >> ~/.ssh/known_hosts
          chmod 700 ~/.ssh
          chmod 600 ~/.ssh/known_hosts

      - name: Test SSH connectivity (password)
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          sshpass -p "${SERVER_PASSWORD}" ssh \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o PasswordAuthentication=yes \
            -o StrictHostKeyChecking=yes \
            "${SERVER_USER}@${SERVER_IP}" \
            "whoami && hostname && echo SSH_OK"

      - name: Run remote deploy script
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          sshpass -p "${SERVER_PASSWORD}" ssh \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o PasswordAuthentication=yes \
            -o StrictHostKeyChecking=yes \
            "${SERVER_USER}@${SERVER_IP}" \
            "bash /home/app/vacrw/deploy.sh"
