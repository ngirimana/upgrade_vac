name: CI & Deploy (vac.rw)

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

concurrency:
  group: deploy-vacrw
  cancel-in-progress: true

jobs:
  ci:
    name: Build (CI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (LTS) + Yarn cache
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'yarn'

      - name: Enable Corepack (Yarn)
        run: corepack enable

      - name: Install dependencies
        run: |
          if [ -f .yarnrc.yml ]; then
            echo "Yarn Berry detected"
            yarn install --immutable
          else
            echo "Yarn Classic detected"
            yarn install --frozen-lockfile
          fi

      - name: Build Next.js
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: yarn build

  deploy:
    name: Deploy to Contabo
    needs: ci
    if: ${{ needs.ci.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Recreate private key from base64 (ed25519)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh

          # Decode private key stored in secrets.SSH_KEY_BASE64
          printf '%s' "${{ secrets.SSH_KEY_BASE64 }}" | tr -d '\r\n ' | base64 -d > ~/.ssh/id_ed25519

          chmod 600 ~/.ssh/id_ed25519
          chmod 700 ~/.ssh

          echo "Runner key fingerprint:"
          ssh-keygen -lf ~/.ssh/id_ed25519

      - name: Add server to known_hosts
        shell: bash
        run: |
          set -euo pipefail
          ssh-keyscan -H "${{ secrets.SERVER_IP }}" >> ~/.ssh/known_hosts

      - name: Test SSH connectivity
        shell: bash
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_IP:   ${{ secrets.SERVER_IP }}
        run: |
          set -euo pipefail
          echo "Target is: ${SERVER_USER}@${SERVER_IP}"

          ssh \
            -o BatchMode=yes \
            -o PreferredAuthentications=publickey \
            -o PasswordAuthentication=no \
            -o IdentitiesOnly=yes \
            -i ~/.ssh/id_ed25519 \
            "${SERVER_USER}@${SERVER_IP}" \
            'whoami && hostname && echo "SSH handshake OK"'

      - name: Run remote deploy script
        shell: bash
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_IP:   ${{ secrets.SERVER_IP }}
        run: |
          set -euo pipefail

          ssh \
            -o BatchMode=yes \
            -o PreferredAuthentications=publickey \
            -o PasswordAuthentication=no \
            -o IdentitiesOnly=yes \
            -i ~/.ssh/id_ed25519 \
            "${SERVER_USER}@${SERVER_IP}" \
            'bash ~/vacrw/deploy.sh'